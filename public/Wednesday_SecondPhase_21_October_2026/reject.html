<script>
   let promise = new Promise(function (resolve, reject) {

    let marks = 25;

    if (marks >= 35) {

        resolve("Student Passed");

    } else {

        reject("Student Failed");

    }

});

promise
    .then(function (result) {

        console.log(result);

    })
    .catch(function (error) {

        console.log(error);

    });
</script>
