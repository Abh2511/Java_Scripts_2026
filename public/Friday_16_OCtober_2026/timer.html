<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function PrintNumbers(){
            setTimeout(function(){
                for(var i=1; i<=10; i++){
                document.querySelector("h1").innerHTML +=  i + "<br>";
            }
            },1000)
        }
        function bodyload(){
            setTimeout(PrintNumbers,2000);
        }
    </script>
</head>
<body onload="bodyload()">
   <h1 align="center"></h1>
</body>
</html>
