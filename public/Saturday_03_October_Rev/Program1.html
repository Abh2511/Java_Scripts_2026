<script>
    
let employees = ["Rahul", "Amit", "Abhirat", "Rohit"];

let searchName = "Abhirat";
let found = false;

for (let i = 0; i < employees.length; i++) {

    if (employees[i] === searchName) {
        found = true;
        break;
    }
}

if (found) {
    console.log("Employee Found");
} else {
    console.log("Employee Not Found");
}
</script>
