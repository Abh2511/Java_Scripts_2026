<script>
    class Employee
    {
        FirstName;
        LastName;
        Designation;
        Print(){
            document.write(`${this.FirstName} ${this.LastName} - ${this.Designation}<br>`);
        }
    }

    class Devloper extends Employee 
    {
        FirstName = "Raj";
        LastName = " Kumar";
        Designation = "Developer";
        Role = "Developer Role : Build,Debug,Test,Deploy";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
    class Admin extends Employee 
    {
        FirstName = "Raja";
        LastName = " Vishwas";
        Designation = "Admin";
        Role = "Admin Role : Managing Role for the Teams";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
    class Manager extends Employee 
    {
        FirstName = "Raj";
        LastName = " Kumawqas";
        Designation = "Manager";
        Role = "Manager Role : Managing the teams";
        Print(){
            super.Print();
            document.write(`${this.Role}`);
        }
    }
    let employees = new Array(new Devloper(),new Admin(),new Manager());
    let designation = prompt("Enter Designation");
    for(var employee of employees)
    {
        if(employee.Designation==designation){
            employee.Print();
        }
    }
</script>
