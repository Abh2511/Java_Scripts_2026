<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
        function KeyUpEvent() {
            document.getElementById("result").innerHTML =
                "You released a key!";
        }
    </script>
<body>
    <h2>JavaScript Keyup Event</h2>

    <input type="text" onkeyup="KeyUpEvent()">

    <p id="result"></p>
</body>
</html>
