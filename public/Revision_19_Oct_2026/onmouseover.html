<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function changeColor(element){
            element.style.color = "Aqua";
        }
        function changeColor1(element){
            element.style.color = "Green";
        }

    </script>
</head>
<body>
    <h2 onmouseover="changeColor1(this)">
        Mouse Over Example
    </h2>
    <p onmouseover="changeColor(this)">
        Move Your mouse over this paragraph.
    </p>
</body>
</html>
