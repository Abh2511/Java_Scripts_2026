<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=  , initial-scale=1.0">
    <title>Document</title>
    <script>
        function changeText(){
            document.getElementById("result").innerHTML = "The text has changed !";
        }
    </script>
</head>
<body>
    <h2>Double Click Example</h2>
    <button ondblclick="changeText()">Double Click Me</button>
    <p id="result">Orignal Text`</p>
</body>
</html>
