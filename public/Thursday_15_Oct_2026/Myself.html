<!DOCTYPE html>
<html>
<body>

    <h2 id="heading">Hello JavaScript</h2>

    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            document.getElementById("heading").innerHTML =
                "Welcome to JavaScript Events!";
        }
    </script>

</body>
</html>
