<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Learn AJAX in JavaScript</h2>

    <button onclick="getData()">Get User Data</button>

    <p id="result"></p>

    <script> async function getData() 
    { 
        try 
        { const response = await fetch("https://jsonplaceholder.typicode.com/users/1");
     const user = await response.json(); document.getElementById("result").innerHTML = "Name: " + user.name + "<br>" + "Email: " + user.email; 
     } catch (error) 
     { document.getElementById("result").textContent = "Error loading data!"; }
      } </script>
    
</body>

</html>
