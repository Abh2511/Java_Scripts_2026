<script>
    function Product(id, name, price) {
        if (id == undefined) {
            document.write(`
Name : ${name} <br>
Price : ${price}
`);
        } else {
            document.write(`
Id : ${id} <br>
Name : ${name} <br>
Price : ${price}
`);
        }
    }
    Product("TV", 34000.33);
</script>
