<script>
    function FindRange(number,min,max){
        if(number>=min && number<=max){
            document.write(`Your Number ${number} is with in ${min} - ${max} range`)
        }
        else {
            document.write(`Your Number ${number} is out of ${min} - ${max} range`)
        }
    }
    FindRange(13,1,20);
</script>
