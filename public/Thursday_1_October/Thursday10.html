<script>
    function f1() {
        var n = prompt("Enter Your Mobilw with Country Code");
        switch (true) {

            case n.match(/\+91\d{10/):
                document.write("Your Country is India");
                break;
            case n.match(/\+\(1\)\d{3}\s\d{4}\s\d{4}/):
                document.write("Your Country is US");
                break;
            default:
                document.write("Invalid Mobile")
                break;
        }
    }
</script>
