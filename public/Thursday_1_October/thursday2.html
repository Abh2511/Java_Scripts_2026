<script>
  function FindLargest(a,b,c){
  if(a>b && a>c)
  {
    document.write(`The number ${a} is largest `);
  }
  else if(b>a && b>c)
  {
    document.write(`The number ${b} is largest `);
  } 
  else
  {
    document.write(`The number ${c} is largest `);

  }
}
  FindLargest(4,51,62);
  
</script>
