<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loading Percentage</title>

    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.css">

    <script>

        var count = 0;
        var timer;

        function ShowStatus() {
            count++;

            document.getElementById("status").innerHTML = count + "%";

            if (count == 10) {
                clearInterval(timer);

                document.getElementById("status").innerHTML = "Loading Completed";
            }
        }

        function LoadClick() {
            document.getElementById("btnLoad").style.display = "none";

            timer = setInterval(ShowStatus, 500);
        }

    </script>
</head>

<body class="container-fluid">

    <div class="d-flex justify-content-center align-items-center" style="height: 400px;">

        <div class="text-center">

            <button id="btnLoad" onclick="LoadClick()" class="btn btn-primary">
                Load Data
            </button>

            <h3 id="status">0%</h3>

        </div>

    </div>

</body>

</html>
