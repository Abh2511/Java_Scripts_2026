<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function DateChange(){
            var weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            var months = ["Jan","Feb","Mar","April","May","June","July"];
            var now = new Date(document.getElementById("date").value);
            // document.querySelector("h3").innerHTML = now.toLocaleDateString();
            document.querySelector("h3").innerHTML = `${weekdays[now.getDay()]}`;
        }
    </script>
</head>
<body>
    Departure : <input type = "datetime-local" onchange="DateChange()" id="date">
    <h3></h3>
</body>
